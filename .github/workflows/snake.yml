name: Generate Profile Assets

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/snake.yml"
      - ".github/scripts/generate_stats.py"
  schedule:
    - cron: "0 0 * * *" # 每天自动运行一次
  workflow_dispatch: # 允许手动触发

concurrency:
  group: profile-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate statistics cards
        run: python3 .github/scripts/generate_stats.py --username "$PROFILE_OWNER" --output dist
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
